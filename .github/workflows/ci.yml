name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: presensi
          POSTGRES_PASSWORD: presensi_test_password
          POSTGRES_DB: presensi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U presensi -d presensi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://presensi:presensi_test_password@localhost:5432/presensi_test?schema=public
      SESSION_SECRET: test-session-secret-32-characters-minimum-xxxxx
      CSRF_SECRET: test-csrf-secret-32-characters-minimum-xxxxxxxxxx
      BCRYPT_ROUNDS: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit (production only)
        run: npm audit --omit=dev
        continue-on-error: true 
